name: "Verify Main"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  typescript_tests:
    name: TypeScript Problem Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Extract node version from package.json
        uses: sergeysova/jq-action@v2
        id: node_version
        with:
          cmd: jq .engines.node package.json -r | sed -e 's/"//g' | sed -e 's/>=//g'
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "${{ steps.node_version.outputs.value }}"
      - name: Use Yarn
        run: corepack enable
      - name: Install deps
        run: yarn
      - name: Run Tests
        run: |
          yarn node scripts/problems.js --target=test --tag=typescript

  react_tests:
    name: React Problem Tests
    runs-on: ubuntu-latest
    container:
      image: cypress/included:latest
      options: --user 1001
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Extract node version from package.json
        uses: sergeysova/jq-action@v2
        id: node_version
        with:
          cmd: jq .engines.node package.json -r | sed -e 's/"//g' | sed -e 's/>=//g'
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "${{ steps.node_version.outputs.value }}"
      - name: Use Yarn
        run: corepack enable
      - name: Install deps
        run: yarn
      - name: Run Tests
        run: |
          yarn node scripts/problems.js --target=test --tag=ui
      - name: Upload failed tests artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: Cypress-Artifacts
          if-no-files-found: ignore
          path: |
            problems/**/cypress/screenshots/**/*.*
            problems/**/cypress/videos/**/*.*
            problems/**/visual-tests/screenshots/comparison
            problems/**/visual-tests/screenshots/diff
